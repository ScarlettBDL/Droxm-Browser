name: Motor nativo (Rust)
description: Prueba el núcleo del bloqueador y compila la librería JNI para Android en app/src/main/jniLibs.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          rust/core
          rust/jni

    # Los tests del núcleo SI hacen fallar el build: si el motor está roto, no se publica.
    - name: Tests del núcleo
      shell: bash
      run: cd rust/core && cargo test --release

    # La librería nativa es una optimización: si falla, el APK se arma igual con el bloqueador de reserva en Kotlin.
    - name: Compilar librería nativa
      shell: bash
      continue-on-error: true
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      run: |
        cargo install cargo-ndk --locked
        cd rust/jni
        cargo ndk --platform 26 -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../app/src/main/jniLibs build --release

    - name: Avisar si falta la librería
      shell: bash
      run: |
        if ls app/src/main/jniLibs/*/libdroxm_adblock.so >/dev/null 2>&1; then
          ls -l app/src/main/jniLibs/*/libdroxm_adblock.so
        else
          echo "::warning::No se pudo compilar la librería nativa de Rust; el APK usa el bloqueador de reserva (más lento)."
        fi
